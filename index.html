<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b4aa2">
  <title>مکتب تابش نور | انتخاب زبان</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body class="home-page">
  <main class="language-screen">
    <div class="brand-mark" aria-hidden="true">TN</div>
    <p class="eyebrow" data-i18n="welcomeEyebrow">به وب‌سایت رسمی</p>
    <h1 data-i18n="schoolName">مکتب تابش نور</h1>
    <p class="intro" data-i18n="chooseLanguage">لطفاً زبان مورد نظر خود را انتخاب کنید</p>
    <div class="language-options" aria-label="Choose language">
      <button class="language-button" type="button" data-language="fa">دری <span>Dari</span></button>
      <button class="language-button" type="button" data-language="ps">پښتو <span>Pashto</span></button>
      <button class="language-button" type="button" data-language="en">English</button>
    </div>
    <p class="small-note" data-i18n="languageNote">بعد از انتخاب زبان، می‌توانید آن را از داخل وب‌سایت تغییر دهید.</p>
    <footer>© <span id="year"></span> Tabish-e-Noor School</footer>
  </main>
</body>
</html>
