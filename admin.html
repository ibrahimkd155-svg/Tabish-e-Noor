<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت | تابش نور</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="extra.css"></head><body><header class="site-header"><a class="brand" href="branches.html"><img src="logo.jpeg" alt="لوگوی مکتب"><span class="brand-name"><strong>پنل مدیریت تابش نور</strong><small>Tabish-e-Noor Admin</small></span></a><nav><a href="branches.html">مشاهده سایت</a><button id="logout" class="text-button" hidden>خروج</button></nav></header><main class="page-container"><section id="login-panel" class="content-section admin-card"><h1>ورود مدیر</h1><p>با ایمیل و رمز حساب مدیر وارد شوید.</p><form id="login-form" class="admin-form"><label>ایمیل<input id="email" type="email" required autocomplete="username"></label><label>رمز عبور<input id="password" type="password" required autocomplete="current-password"></label><button class="primary-button" type="submit">ورود</button><p id="login-message" class="status"></p></form></section><div id="dashboard" hidden><div class="dashboard-head"><h1>مدیریت محتوای مکتب</h1><p id="admin-message" class="status"></p></div><section class="content-section admin-card"><h2>معلومات شعبه</h2><form id="branch-form" class="admin-form"><label>نام شعبه<input id="branch-name" value="شعبه اصلی" required></label><label>آدرس<input id="address" required></label><label>شماره تماس<input id="phone"></label><label>ساعات صبح<input id="morning"></label><label>ساعات بعد از ظهر<input id="afternoon"></label><label>صنف‌ها<input id="grades"></label><label>نام مدیر<input id="manager"></label><button class="primary-button">ذخیره معلومات شعبه</button></form></section><section class="content-section admin-card"><h2>افزودن خبر یا اعلان</h2><form id="news-form" class="admin-form"><label>عنوان<input id="news-title" required></label><label>متن<textarea id="news-content" rows="4" required></textarea></label><label class="check"><input id="news-published" type="checkbox" checked> نشر شود</label><button class="primary-button">ثبت خبر</button></form><div id="admin-news"></div></section><section class="content-section admin-card"><h2>افزودن عکس یا ویدیو به گالری</h2><form id="media-form" class="admin-form"><label>انتخاب فایل<input id="media-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm" required></label><label>توضیح<input id="media-caption"></label><button class="primary-button">آپلود فایل</button></form><div id="admin-gallery" class="gallery-grid"></div></section></div></main><footer>سیستم مدیریت لیسه عالی خصوصی تابش نور</footer><script type="module" src="admin.js"></script></body></html>
