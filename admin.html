<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت | تابش نور</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="extra.css"></head><body>
<header class="site-header"><a class="brand" href="branches.html"><img src="logo.jpeg" alt="لوگوی مکتب"><span class="brand-name"><strong>پنل مدیریت تابش نور</strong><small>Tabish-e-Noor Admin</small></span></a><nav><a href="branches.html">مشاهده سایت</a><button id="logout" class="text-button" hidden>خروج</button></nav></header>
<main class="page-container"><section id="login-panel" class="content-section admin-card"><h1>ورود مدیر</h1><p>با ایمیل و رمز حساب مدیر وارد شوید.</p><form id="login-form" class="admin-form"><label>ایمیل<input id="email" type="email" required autocomplete="username"></label><label>رمز عبور<input id="password" type="password" required autocomplete="current-password"></label><button class="primary-button" type="submit">ورود</button><p id="login-message" class="status" role="status"></p></form></section>
<div id="dashboard" hidden><div class="dashboard-head"><h1>مدیریت محتوای مکتب</h1><p id="admin-message" class="status" role="status"></p></div>
<section class="content-section admin-card"><h2>مدیریت شعبه‌ها</h2><label class="admin-select-label">انتخاب شعبه<select id="branch-select"><option value="1">شعبه اول</option><option value="2">شعبه دوم</option><option value="3">شعبه سوم</option></select></label>
<form id="branch-form" class="admin-form"><fieldset class="localized-fields"><legend>نام شعبه</legend><label>دری<input id="branch-name-fa" required></label><label>پښتو<input id="branch-name-ps" required></label><label>English<input id="branch-name-en" required></label></fieldset><label>آدرس<input id="address"></label><label>شماره تماس<input id="phone"></label><label>ساعات تایم صبح<input id="morning"></label><label>نام مدیر تایم صبح<input id="manager-morning"></label><label>ساعات تایم بعد از ظهر<input id="afternoon"></label><label>نام مدیر تایم بعد از ظهر<input id="manager-afternoon"></label><label>صنف‌ها<input id="grades"></label><button class="primary-button" type="submit">ذخیره معلومات این شعبه</button></form></section>
<section class="content-section admin-card"><h2>افزودن خبر یا اعلان</h2><form id="news-form" class="admin-form"><fieldset class="localized-fields"><legend>عنوان خبر</legend><label>دری<input id="news-title-fa" required></label><label>پښتو<input id="news-title-ps" required></label><label>English<input id="news-title-en" required></label></fieldset><fieldset class="localized-fields"><legend>متن خبر</legend><label>دری<textarea id="news-content-fa" rows="3" required></textarea></label><label>پښتو<textarea id="news-content-ps" rows="3" required></textarea></label><label>English<textarea id="news-content-en" rows="3" required></textarea></label></fieldset><label class="check"><input id="news-published" type="checkbox" checked> نشر شود</label><button class="primary-button" type="submit">ثبت خبر</button></form><div id="admin-news"></div></section>
<section class="content-section admin-card"><h2>افزودن عکس یا ویدیو به گالری</h2><form id="media-form" class="admin-form"><label>انتخاب فایل<input id="media-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm" required></label><fieldset class="localized-fields"><legend>توضیح گالری</legend><label>دری<input id="media-caption-fa"></label><label>پښتو<input id="media-caption-ps"></label><label>English<input id="media-caption-en"></label></fieldset><button class="primary-button" type="submit">آپلود فایل</button></form><div id="admin-gallery" class="gallery-grid"></div></section></div></main><footer>سیستم مدیریت لیسه عالی خصوصی تابش نور</footer><script type="module" src="admin.js"></script></body></html>
